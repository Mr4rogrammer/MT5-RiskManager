services:
  mt5:
    build:
      context: backend/mt5
      dockerfile: Dockerfile
    container_name: mt5
    volumes:
      - ./config:/config
    env_file:
      - .env
    restart: unless-stopped
    ports:
      - 3000:3000   # VNC web access
      - 5001:5001   # MT5 Flask API

  # Bot performance dashboard: a static page that reads the bots' SQLite
  # snapshot (config/data/dashboard.db) in the browser. No API involved.
  dashboard:
    build:
      context: backend/dashboard
    container_name: bot-dashboard
    restart: unless-stopped
    environment:
      DASHBOARD_USER: ${DASHBOARD_USER}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD}
    volumes:
      - ./config:/botconfig:ro   # only data/dashboard.db is served (see nginx.conf)
      - ./config/control:/botcontrol   # start/stop files written by the page, read by the bots
    ports:
      - 8080:80

  # HTTPS for the dashboard on your own domain (DASHBOARD_DOMAIN in .env, e.g.
  # bots.mrejp.tech). Free Let's Encrypt certificate, renewed automatically.
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    depends_on:
      - dashboard
    environment:
      DASHBOARD_DOMAIN: ${DASHBOARD_DOMAIN:-localhost}
    volumes:
      - ./backend/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data         # certificates — keep, or Let's Encrypt rate limits apply
      - caddy_config:/config
    ports:
      - 80:80
      - 443:443

volumes:
  caddy_data:
  caddy_config:
