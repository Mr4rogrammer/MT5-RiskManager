server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    auth_basic           "Bot dashboard";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # SQLite pages and the page itself compress 3-5x
    gzip            on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types      application/vnd.sqlite3 application/javascript text/css;   # text/html is always on

    # The bots' config volume is mounted read-only at /botconfig. Only the
    # snapshot file is exposed; nothing else under it is reachable.
    # "no-cache" = the browser keeps a copy but asks every time whether it
    # changed (ETag / Last-Modified); an unchanged snapshot costs a ~200-byte 304.
    location = /data/dashboard.db {
        alias /botconfig/data/dashboard.db;
        default_type application/vnd.sqlite3;
        add_header Cache-Control "no-cache";
    }

    location /data/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}
