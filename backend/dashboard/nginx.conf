server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    auth_basic           "Bot dashboard";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # SQLite pages and the page itself compress 3-5x
    gzip            on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types      application/vnd.sqlite3 application/javascript text/css;   # text/html is always on

    # The bots' config volume is mounted read-only at /botconfig. Only the
    # snapshot file is exposed; nothing else under it is reachable.
    # "no-cache" = the browser keeps a copy but asks every time whether it
    # changed (ETag / Last-Modified); an unchanged snapshot costs a ~200-byte 304.
    location = /data/dashboard.db {
        alias /botconfig/data/dashboard.db;
        default_type application/vnd.sqlite3;
        add_header Cache-Control "no-cache";
    }

    # Live P/L of open trades, rewritten by the bots every ~2 s; ~1 KB, polled by the page
    location = /data/live.json {
        alias /botconfig/data/live.json;
        default_type application/json;
        add_header Cache-Control "no-store";
    }

    location /data/ {
        return 404;
    }

    # Start / stop a bot: the page PUTs "run" or "stop" to /control/<bot name>
    # (and the account limits as JSON to /control/_limits),
    # which lands in config/control/<bot name> (the only writable mount). Each bot
    # reads its own file on every poll. Same basic auth as the page; cross-site
    # pages can't PUT here because no CORS headers are ever sent.
    location ~ "^/control/([a-z0-9_]{1,32})$" {   # quoted: nginx reads a bare { as a block
        alias /botcontrol/$1;
        dav_methods          PUT;
        dav_access           user:rw group:rw all:r;
        client_max_body_size 256;            # "run" / "stop" / the small _limits JSON
        client_body_temp_path /botcontrol/.tmp;
        limit_except GET PUT { deny all; }
        add_header Cache-Control "no-store";
    }

    location /control/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}
